[project]
name = "pipeline"
version = "0.1.0"
description = "HOLYWATER test task: idea -> script -> edited vertical video with the line heard verbatim"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rich>=13.7",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "imageio-ffmpeg>=0.5",
    "jiwer>=3.0",
    "num2words>=0.5",
    "fastapi>=0.115",
    "opencv-contrib-python-headless>=4.10",
    # only for the official file upload to the fal CDN; model calls use plain REST
    "fal-client>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Kokoro voice (used in real mode too) and an offline whisper: ~620 MB of models.
local = [
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    # Acceptance test in a real browser: uses the installed Chrome (channel="chrome"), or run
    # `uv run playwright install chromium` if there is none.
    "playwright>=1.50",
]

[project.scripts]
pipeline = "pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: acceptance test in a real browser (make check)"]
