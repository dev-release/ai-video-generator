[project]
name = "pipeline"
version = "0.1.0"
description = "HOLYWATER test: ідея → сценарій → змонтоване вертикальне відео з дослівною реплікою"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rich>=13.7",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "imageio-ffmpeg>=0.5",
    "faster-whisper>=1.0",
    "jiwer>=3.0",
    "num2words>=0.5",
]

[project.optional-dependencies]
providers = [
    "fal-client>=0.5",
    "google-genai>=1.0",
    "elevenlabs>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
pipeline = "pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
