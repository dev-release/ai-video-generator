# Voice catalog: VoiceProfile -> voices per TTS catalog (`voice_catalog` of the model). The model
# picks only the profile; the code picks the voice. A list, first = main; a second character with
# the same profile takes the next free voice, then voices of other profiles of the same gender.
# A voice belongs to one profile only, and its gender matches the profile name.
#
# kokoro ids and grades: https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md (2026-10-01)

